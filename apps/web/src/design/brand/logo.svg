  <rect x="15" y="20" width="70" height="12" rx="6" />
  <rect x="15" y="44" width="45" height="12" rx="6" />
  <rect x="15" y="68" width="70" height="12" rx="6" />
  <circle cx="75" cy="50" r="6" />
</svg>
