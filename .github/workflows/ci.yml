name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Étages à venir (docs/00-factory/strategy.md §4.1) :
#   - db    : migrations et tests SQL sur PostgreSQL (< 5 min)
#   - contract : contrat / intégration API (< 8 min)
#   - e2e   : E2E sélectif, déclenché par chemin
#   - guardrails : anti-affaiblissement des tests, taille de PR, BR sans test

jobs:
  fast:
    name: Étage rapide
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Épinglage par tag majeur ; l'épinglage par SHA de commit est recommandé.
      - uses: actions/checkout@v7
        with:
          # Historique complet : le merge-base des garde-fous exige la base (origin/<base_ref>).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
      # Le label test-change-approved (derogation de test-weakening) ne doit etre pose que par un humain
      # (droits de triage du depot) ; la CI ne le deduit jamais et aucun agent ne doit le poser.
      - name: Garde-fous de PR
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm run guard:test-weakening -- --base "origin/$BASE_REF"
          npm run guard:pr-size -- --base "origin/$BASE_REF"
          npm run guard:br-coverage

  # Tests navigateur (Playwright, axe-core) et banc fps : informatifs, jamais bloquants (npm run test:browser / bench:browser).
  browser:
    name: Navigateur (non bloquant)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run test:browser
      - run: npm run bench:browser
        if: always()
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tests-navigateur
          path: tests/browser/out/
          if-no-files-found: ignore

  # Schemathesis contre l'API réelle (npm run test:schemathesis) : informatif, jamais bloquant. Voir tests/schemathesis/README.md.
  schemathesis:
    name: Schemathesis (non bloquant)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/schemathesis/requirements.txt
      - run: npm run test:schemathesis
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: schemathesis
          path: tests/schemathesis/out/
          if-no-files-found: ignore

  # Scan de sécurité (npm run scan : gitleaks, OSV-Scanner, Semgrep) : informatif, jamais bloquant. Voir docs/03-tech/quality/scan-securite.md.
  security:
    name: Sécurité (non bloquant)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : gitleaks scanne tous les commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/scan/requirements-semgrep.txt
      - run: npm run scan
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-securite
          path: tests/security/out/
          if-no-files-found: ignore
