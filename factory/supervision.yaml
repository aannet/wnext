# Seuils du Superviseur et de l'orchestrateur (ADR-006, ADR-007).
# Chaque valeur cite le paragraphe de docs/00-factory/strategy.md dont elle provient.
# Sous CODEOWNERS /factory/ : modifié seulement par PR relue (l'Introspecteur propose, §4.9).
# Convention : `*_max` = déclenche quand la valeur observée est STRICTEMENT supérieure ;
# `max_cycles_*` / `max_review_returns` = plafond atteint quand le compteur >= valeur.
# Validé par factory/orchestrator/src/config.ts : clé inconnue ou nombre négatif refusé.
version: 1

supervisor:
  tick_s: 30                 # §4.8 : le Superviseur tourne toutes les 30 s
  heartbeat_alert_s: 120     # §4.8 : absence de supervisor.tick pendant 2 min = alerte humaine

warn:                        # §4.8 niveau 1 : signaler (supervisor.warn)
  idle_without_commit_min: 15     # agent actif > 15 min sans commit ni changement d'état
  tool_calls_without_commit: 20   # > 20 appels d'outils sans commit
  identical_llm_calls: 2          # 2 appels de modèle quasi identiques d'affilée

assess:                      # §4.8 niveau 2 : évaluer (Dépanneur O)
  persistence_min: 10             # signal de niveau 1 persistant 10 min
  mute_agent_min: 5               # agent muet 5 min (ADR-006 ; watchdog §5)

interrupt:                   # §4.8 niveau 3 : interrompre
  no_progress_min: 45             # > 45 min sans progrès mesurable
  # La durée murale de 3 h (§4.8) est unique : retries.max_wall_clock_min.

relaunch:                    # §4.8 niveaux 4 et 5
  max_per_agent_and_line: 1       # une seule relance par agent et par ligne
  max_f_escalations_per_line: 1   # §3 règle 1 : une seule montée vers F par ligne
  block_at_interruption: 2        # 2e interruption de la ligne => blocked

retries:                     # §4.3 : retries bornés
  max_cycles_total: 5             # max 5 cycles impl->CI
  max_cycles_per_model: 2         # dont max 2 par modèle
  max_review_returns: 2           # max 2 retours de review
  max_wall_clock_min: 180         # durée murale max 3 h (aussi §4.8 niveau 3)
  line_budget_factor: 3           # budget tokens de ligne = 3 x estimation du Router
  api_backoff_max_attempts: 3     # §3 règle 2 : backoff exponentiel, 3 tentatives avant de changer de modèle

loop:                        # §4.4 : détection de boucle
  diff_repeat_consecutive: 2      # même hash de diff 2 fois de suite
  diff_similarity: 0.9            # ou similarité > 90 %
  error_signature_repeats: 3      # même signature d'erreur CI 3 fois
  oscillation_enabled: true       # oscillation A -> B -> A sur un fichier
  tool_calls_without_commit: 40   # > 40 appels d'outils sans nouveau commit
  tokens_per_changed_line_ratio: 5      # tokens/ligne modifiée > 5 x médiane de la phase
  budget_fraction_without_green_gain: 0.5  # > 50 % du budget de ligne sans hausse des tests verts

kill:                        # §4.5 kill-switch ; §1 plafonds de phase
  stop_deadline_s: 30             # arrêt en < 30 s
  phase_budget_alert_ratio: 0.8   # §1 : alerte à 80 % du budget de phase
  phase_budget_ceiling_factor: 1.3  # §1 : plafond dur = 1,3 x budget
  looping_lines_per_hour_max: 3   # > 3 lignes looping en 1 h
  interruptions_per_hour_max: 3   # §4.8 : > 3 interruptions en 1 h sur la phase
  ci_failure_rate_max: 0.6        # taux d'échec CI > 60 %
  ci_failure_window_lines: 20     # ... sur 20 lignes
  cost_per_hour_usd_max: null     # §4.5 : « coût/heure > seuil » sans valeur chiffrée : désactivé jusqu'à décision
