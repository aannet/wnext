<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Spike grille A (DOM)</title>
<style>
*{box-sizing:border-box}body{margin:0;font:12px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
#bar{padding:6px;display:flex;gap:6px;border-bottom:1px solid #ccc}
#scroll{flex:1;overflow:auto;position:relative;contain:strict}
#sizer{position:relative}
#head{position:sticky;top:0;z-index:5;height:40px;background:#f4f4f4;border-bottom:1px solid #bbb}
.hc{position:absolute;top:0;height:40px;border-left:1px solid #ddd;padding:2px 3px;overflow:hidden;white-space:nowrap}
.row{position:absolute;left:0;height:64px;border-bottom:1px solid #e3e3e3;overflow:hidden}
.name{position:sticky;left:0;z-index:3;width:160px;height:64px;background:#fff;border-right:1px solid #bbb;padding:4px;float:left}
.blk{position:absolute;border-radius:3px;color:#fff;font-size:10px;overflow:hidden;white-space:nowrap;cursor:grab;user-select:none;touch-action:none;border:1px solid rgba(0,0,0,.25)}
.blk.drag{opacity:.8;z-index:4}
.hl,.hr{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}.hl{left:0}.hr{right:0}
.hh{position:absolute;left:0;right:0;bottom:0;height:4px;cursor:ns-resize;background:rgba(255,255,255,.35)}
.over{color:#c00;font-weight:700}
#today{position:absolute;top:0;bottom:0;width:2px;background:#e33;z-index:2;pointer-events:none}
</style></head><body>
<div id="bar"><button id="zd">Jour</button><button id="zw">Semaine</button><button id="zm">Mois</button><button id="today-btn">Aujourd'hui</button></div>
<div id="scroll"><div id="sizer"><div id="head"></div></div></div>
<script type="module" src="/src/main.ts"></script></body></html>
