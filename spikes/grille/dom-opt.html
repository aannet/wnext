<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Spike grille A2 (DOM optimisé)</title>
<style>
*{box-sizing:border-box}body{margin:0;font:12px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
#bar{padding:6px;display:flex;gap:6px;border-bottom:1px solid #ccc}
#scroll{flex:1;overflow:auto;position:relative;contain:strict}
#sizer{position:relative}
#head{position:sticky;top:0;z-index:5;height:40px;background:#f4f4f4;border-bottom:1px solid #bbb;contain:strict}
#corner{position:sticky;left:0;z-index:1;width:160px;height:40px;background:#f4f4f4;border-right:1px solid #bbb}
.hc{position:absolute;left:0;top:0;height:40px;border-left:1px solid #ddd;padding:2px 3px;overflow:hidden;white-space:nowrap;contain:strict}
#names{position:sticky;left:0;z-index:4;width:160px;background:#fff;border-right:1px solid #bbb;contain:strict}
.nm{position:absolute;left:0;top:0;width:159px;height:64px;padding:4px;border-bottom:1px solid #e3e3e3;contain:strict}
.nm.over{color:#c00;font-weight:700}
#grid{position:absolute;left:160px;top:40px;contain:strict;background-repeat:repeat-x}
.row{position:absolute;left:0;top:0;height:64px;border-bottom:1px solid #e3e3e3;contain:strict}
.cv .row{content-visibility:auto;contain-intrinsic-size:auto 64px}
.blk{position:absolute;left:0;top:0;border-radius:3px;color:#fff;font-size:10px;overflow:hidden;white-space:nowrap;cursor:grab;user-select:none;touch-action:none;border:1px solid rgba(0,0,0,.25);padding-left:3px;contain:strict}
.blk.drag{opacity:.8;z-index:4}
#today{position:absolute;top:0;left:0;bottom:0;width:2px;background:#e33;z-index:2;pointer-events:none}
</style></head><body>
<div id="bar"><button id="zd">Jour</button><button id="zw">Semaine</button><button id="zm">Mois</button><button id="today-btn">Aujourd'hui</button></div>
<div id="scroll"><div id="sizer"><div id="head"><div id="corner"></div></div><div id="names"></div><div id="grid"><div id="today"></div></div></div></div>
<script type="module" src="/src/main-dom-opt.ts"></script></body></html>
